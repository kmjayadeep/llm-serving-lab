apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      containers:
        - name: vllm
          image: rocm/vllm-dev:rocm7.2.1_navi_ubuntu24.04_py3.12_pytorch_2.9_vllm_0.16.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - >-
              exec vllm serve Qwen/Qwen2.5-0.5B-Instruct
              --served-model-name Qwen/Qwen2.5-0.5B-Instruct
              --dtype float16
              --max-model-len 2048
              --gpu-memory-utilization 0.75
              --enforce-eager
          env:
            # With one GPU allocated by the device plugin, the container should
            # generally see it as its sole visible accelerator. Verify this on
            # the selected plugin/runtime instead of hard-coding a host index.
            - name: PORT
              value: "8000"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              amd.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: huggingface-cache
