apiVersion: v1
kind: Namespace
metadata:
  name: llm-serving-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-test-config
  namespace: llm-serving-lab
data:
  APP_MESSAGE: "lightweight inference stand-in"
  app.py: |
    import json
    import os
    import socket
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from pathlib import Path

    started_at = time.monotonic()
    data_dir = Path("/data")
    visits_file = data_dir / "visits.log"

    def startup_complete():
        delay = int(os.getenv("STARTUP_DELAY_SECONDS", "3"))
        return not os.getenv("FAIL_STARTUP", "false").lower() == "true" and time.monotonic() - started_at >= delay

    class Handler(BaseHTTPRequestHandler):
        def reply(self, status, body, content_type="text/plain; charset=utf-8"):
            payload = body.encode()
            self.send_response(status)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def do_GET(self):
            if self.path == "/startup":
                self.reply(200 if startup_complete() else 503, "started\n" if startup_complete() else "starting\n")
                return
            if self.path == "/ready":
                ready = startup_complete() and not Path("/tmp/not-ready").exists()
                self.reply(200 if ready else 503, "ready\n" if ready else "not ready\n")
                return
            if self.path == "/live":
                live = not Path("/tmp/unhealthy").exists()
                self.reply(200 if live else 500, "alive\n" if live else "unhealthy\n")
                return
            if self.path == "/":
                data_dir.mkdir(parents=True, exist_ok=True)
                with visits_file.open("a") as visits:
                    visits.write(f"{time.time()} {socket.gethostname()}\n")
                response = {
                    "message": os.getenv("APP_MESSAGE", "inference test"),
                    "version": os.getenv("APP_VERSION", "unknown"),
                    "pod": socket.gethostname(),
                    "persistent_visits": sum(1 for _ in visits_file.open()),
                }
                self.reply(200, json.dumps(response) + "\n", "application/json")
                return
            self.reply(404, "not found\n")

        def log_message(self, fmt, *args):
            print(f"{self.address_string()} - {fmt % args}", flush=True)

    ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inference-test-data
  namespace: llm-serving-lab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-test
  namespace: llm-serving-lab
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inference-test
  template:
    metadata:
      labels:
        app: inference-test
        version: v1
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: server
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "/app/app.py"]
          env:
            - name: APP_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: inference-test-config
                  key: APP_MESSAGE
            - name: APP_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['version']
            - name: STARTUP_DELAY_SECONDS
              value: "3"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /startup
              port: http
            periodSeconds: 2
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            failureThreshold: 2
          volumeMounts:
            - name: application
              mountPath: /app
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: application
          configMap:
            name: inference-test-config
        - name: data
          persistentVolumeClaim:
            claimName: inference-test-data
---
apiVersion: v1
kind: Service
metadata:
  name: inference-test
  namespace: llm-serving-lab
spec:
  type: NodePort
  selector:
    app: inference-test
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
