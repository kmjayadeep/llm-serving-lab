apiVersion: v1
kind: Namespace
metadata:
  name: llm-serving-gpu-lab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: llm-serving-gpu-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm-serving-gpu-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      hostIPC: true
      containers:
        - name: ollama
          image: ollama/ollama:rocm@sha256:36a99c0aaa4d28d0fc84969124bcf2f3d1ba8ab89181e2bd33bbc12f6ac2c4ce
          imagePullPolicy: IfNotPresent
          env:
            # This host enumerates the RX 7900 GRE before the Raphael iGPU.
            - name: ROCR_VISIBLE_DEVICES
              value: "0"
            - name: OLLAMA_KEEP_ALIVE
              value: "10m"
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              amd.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 8Gi
              amd.com/gpu: "1"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            seccompProfile:
              type: Unconfined
          startupProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm-serving-gpu-lab
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
      nodePort: 30434
